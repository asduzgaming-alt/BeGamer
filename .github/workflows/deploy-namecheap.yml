# GitHub builds the Astro site on every push to main.
# Deployment stays OFF until repository variable BEGAMER_DEPLOY_ENABLED=true.
# Configure an FTPS account restricted to begamer.xyz's Document Root.
# Manual 'Run workflow' defaults to safe preview; explicitly choosing publish uploads files.
# Pushes are gated off until BEGAMER_DEPLOY_ENABLED=true.
# Publishing on push requires BOTH BEGAMER_DEPLOY_ENABLED=true and BEGAMER_DEPLOY_MODE=publish.
# This deploys a review build (noindex; contact PHP requires later config). User accepted launching with those limitations.
name: BeGamer - Build and deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Choose preview (no upload) or publish (real upload)'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish

permissions:
  contents: read

concurrency:
  group: begamer-namecheap
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build review site
        run: npm run build

      - name: Verify generated files
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/es/index.html
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -f dist/api/contact.php

      - name: Check FTPS credentials are configured
        if: ${{ github.event_name == 'workflow_dispatch' || vars.BEGAMER_DEPLOY_ENABLED == 'true' }}
        env:
          FTPS_HOST: ${{ secrets.BEGAMER_FTPS_HOST }}
          FTPS_USER: ${{ secrets.BEGAMER_FTPS_USER }}
          FTPS_PASSWORD: ${{ secrets.BEGAMER_FTPS_PASSWORD }}
        run: |
          test -n "$FTPS_HOST" || { echo "Missing BEGAMER_FTPS_HOST secret"; exit 1; }
          test -n "$FTPS_USER" || { echo "Missing BEGAMER_FTPS_USER secret"; exit 1; }
          test -n "$FTPS_PASSWORD" || { echo "Missing BEGAMER_FTPS_PASSWORD secret"; exit 1; }

      - name: Preview FTPS changes on manual run or gated deploy on push
        if: ${{ github.event_name == 'workflow_dispatch' || vars.BEGAMER_DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.BEGAMER_FTPS_HOST }}
          username: ${{ secrets.BEGAMER_FTPS_USER }}
          password: ${{ secrets.BEGAMER_FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          dry-run: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_mode != 'publish') || (github.event_name == 'push' && vars.BEGAMER_DEPLOY_MODE != 'publish') }}
          local-dir: ./dist/
          # The dedicated FTP account must be jailed to begamer.xyz's Document Root.
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
