# Connection-only test. Does not upload, delete or modify remote files.
name: BeGamer - Test Namecheap FTPS connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ftps:
    name: Test secure FTP login (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secrets and test encrypted FTP connection
        shell: bash
        env:
          FTPS_HOST: ${{ secrets.BEGAMER_FTPS_HOST }}
          FTPS_USER: ${{ secrets.BEGAMER_FTPS_USER }}
          FTPS_PASSWORD: ${{ secrets.BEGAMER_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTPS_HOST" || { echo "Missing BEGAMER_FTPS_HOST"; exit 1; }
          test -n "$FTPS_USER" || { echo "Missing BEGAMER_FTPS_USER"; exit 1; }
          test -n "$FTPS_PASSWORD" || { echo "Missing BEGAMER_FTPS_PASSWORD"; exit 1; }
          echo "Checking explicit FTPS on port 21 (no uploads)..."
          curl --silent --show-error --fail --ssl-reqd \
            --connect-timeout 15 --max-time 60 \
            --user "$FTPS_USER:$FTPS_PASSWORD" \
            --output /dev/null "ftp://$FTPS_HOST:21/"
          echo "FTPS connection confirmed. No files were uploaded or modified."
